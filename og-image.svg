<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#faf8f5"/>

  <!-- Centered content group -->
  <g transform="translate(600, 315)">
    <!-- Logo mark (integral symbol in rounded square) -->
    <rect x="-120" y="-60" width="100" height="100" rx="16" fill="#c05030"/>
    <text x="-70" y="12" font-family="Georgia, serif" font-size="64" font-weight="600" fill="white" text-anchor="middle">∫</text>

    <!-- OrgMath text -->
    <text x="40" y="14" font-family="'IBM Plex Mono', Menlo, monospace" font-size="56" font-weight="600" fill="#2c2825" text-anchor="start">OrgMath</text>
  </g>

  <!-- Tagline -->
  <text x="600" y="420" font-family="'Source Serif 4', Georgia, serif" font-size="28" fill="#8a8480" text-anchor="middle">Collaborative Math Editor with Org-mode &amp; LaTeX</text>
</svg>
